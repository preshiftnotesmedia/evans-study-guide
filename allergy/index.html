<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Allergy matrix · Lielle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root { --ink: #f3f4f0; --panel: #ffffff; --line: #d3d7cf; --text: #16202b; --muted: #4b5763; --faint: #5f6a75; --accent: #1d4a73; --err: #b42318; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.5 "Hanken Grotesk", system-ui, sans-serif; }
main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font: 500 12px/1.4 "DM Mono", ui-monospace, monospace; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
h1 { margin: 0; font: 400 40px/1.05 "Bodoni Moda", Georgia, serif; }
h1 em { font-style: italic; }
h1 span { color: var(--accent); }
p { margin: 0; color: var(--muted); }
label { font-weight: 600; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); }
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.row input { width: 22px; height: 22px; accent-color: var(--accent); }
button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; min-height: 48px; font: 600 16px "Hanken Grotesk", system-ui, sans-serif; }
button:disabled { opacity: .6; }
.err { color: var(--err); font-weight: 600; min-height: 1.5em; }
.note { font-size: 13px; color: var(--faint); }
form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow">Lielle · 9575 W Pico Blvd · Los Angeles</div>
    <h1><em>Allergy</em> <span>matrix</span></h1>
    <p>Enter the team passcode to open it. On a terminal, leave "Remember me" ticked so it stays open and updates itself.</p>
    <form id="f" autocomplete="off">
      <label for="pc">Team passcode</label>
      <input type="text" id="pc" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <label class="row"><input type="checkbox" id="rem" checked> Remember me on this device</label>
      <button id="go" type="submit">Open the matrix</button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <p class="note">Ask a manager for the passcode. Study notes, not an official Lielle document; confirm every allergy with Expo or the kitchen.</p>
  </div>
</main>

// The managers' page is its own encrypted file: 12-byte IV, then the team key (for the photos) and the page.
// Swap the sign-in page for the hub. document.open() does nothing while the browser is still reading the
// page, and with a remembered key the decrypt can finish before it has (Nov 12: the hub was written UNDER the
// sign-in box, so the site looked locked or empty). So wait until the page has finished loading first.
async function showPage(html) {
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
  await new Promise(r => setTimeout(r, 0));
  document.open(); document.write(html); document.close();
}

async function unlock(raw) {
